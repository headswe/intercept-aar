name: pages

# Publishes the viewer to GitHub Pages: index.html opens a recording you pick,
# sample.html opens with a made-up recording loaded. Both carry MissionDB's tile
# configs (the tile host has no CORS, so the page cannot read them itself); the
# daily run picks up re-tiled terrains.
on:
  push:
    branches: [main]
    paths: ["viewer/**", ".github/workflows/pages.yml"]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        run: |
          mkdir -p site
          # Configs MissionDB fails to serve are kept from the published page. If none can be had at all
          # the build fails, so a MissionDB outage never replaces a working site with one without tiles.
          python3 viewer/fetch_terrains.py --previous https://headswe.github.io/intercept-aar/ "$RUNNER_TEMP/terrains.json"
          T=(--terrains "$RUNNER_TEMP/terrains.json")
          python3 viewer/build.py "${T[@]}"
          cp viewer/aar-viewer.html site/index.html
          python3 viewer/sample.py site/sample.jsonl
          python3 viewer/build.py site/sample.jsonl "Sample recording (made up)" "${T[@]}"
          cp viewer/aar-viewer.html site/sample.html
          git checkout viewer/aar-viewer.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
