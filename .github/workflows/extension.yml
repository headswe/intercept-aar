name: arma_aar extension

on:
  push:
    paths: ["extension/**", ".github/workflows/extension.yml"]
  pull_request:
    paths: ["extension/**", ".github/workflows/extension.yml"]
  workflow_dispatch:

defaults:
  run:
    working-directory: extension

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check SQF and config with HEMTT
        run: |
          curl -sSL -o /tmp/hemtt.zip https://github.com/BrettMayson/HEMTT/releases/download/v1.22.0/linux-x64.zip
          unzip -q /tmp/hemtt.zip -d /tmp/hemtt && chmod +x /tmp/hemtt/hemtt
          /tmp/hemtt/hemtt check
      - name: Build and test
        run: |
          cmake -S . -B out -DCMAKE_BUILD_TYPE=Release -DAAR_TESTS=ON
          cmake --build out
          ./out/aar_tests
      - uses: actions/upload-artifact@v4
        with:
          name: arma_aar_x64.so
          path: extension/build/Release/arma_aar_x64.so

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -S . -B out -A x64
          cmake --build out --config Release
      - uses: actions/upload-artifact@v4
        with:
          name: arma_aar_x64.dll
          path: extension/build/Release/arma_aar_x64.dll

  package:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: extension/bin
          merge-multiple: true
      - name: Package mod
        run: python3 tools/pack_mod.py out bin/arma_aar_x64.dll bin/arma_aar_x64.so
      - uses: actions/upload-artifact@v4
        with:
          name: "@arma_aar"
          path: extension/out
