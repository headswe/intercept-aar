<title>AAR Viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans+Condensed:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a map table. Plotting board fills the screen, a side ledger lists events and units, and a transport strip along the bottom carries the timeline. */
:root {
  --ground: #e9ebe2;      /* map paper */
  --panel: #f6f7f2;
  --ink: #1d221c;
  --ink-soft: #5b6355;
  --rule: #c9cdbf;
  --grid: rgba(60, 72, 48, .13);
  --grid-major: rgba(60, 72, 48, .3);
  --accent: #c27a00;      /* selection, playhead, tracers */
  --west: #2463c9;
  --east: #c8352a;
  --guer: #2a8a45;
  --civ: #7f44b5;
  --dead: #8a8d84;
  --font-display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --font-ui: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #12161a; --panel: #191e23; --ink: #dfe4dc; --ink-soft: #8f998c; --rule: #2c343b;
    --grid: rgba(160, 190, 170, .07); --grid-major: rgba(160, 190, 170, .17);
    --accent: #f0ad2e; --west: #5b95f0; --east: #ef6656; --guer: #4cc26c; --civ: #b07ce2; --dead: #6b726f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #12161a; --panel: #191e23; --ink: #dfe4dc; --ink-soft: #8f998c; --rule: #2c343b;
  --grid: rgba(160, 190, 170, .07); --grid-major: rgba(160, 190, 170, .17);
  --accent: #f0ad2e; --west: #5b95f0; --east: #ef6656; --guer: #4cc26c; --civ: #b07ce2; --dead: #6b726f;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--ground); color: var(--ink); font-family: var(--font-ui); font-size: 14px; }
* { box-sizing: border-box; }
button, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { height: 100%; display: grid; grid-template-rows: auto 1fr auto; padding-inline: 16px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; padding-block: 12px 10px; border-bottom: 1px solid var(--rule); }
h1 { font-family: var(--font-display); font-weight: 700; font-size: 1.5rem; letter-spacing: .02em; margin: 0; text-transform: uppercase; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 16px; color: var(--ink-soft); font-family: var(--font-data); font-size: 12px; min-width: 0; }
.meta b { color: var(--ink); font-weight: 500; }
.meta .sample { color: var(--accent); }
.load { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.btn { background: var(--panel); border: 1px solid var(--rule); border-radius: 4px; padding: 5px 10px; font-size: 13px; }
.btn:hover { border-color: var(--ink-soft); }
.btn.primary { background: var(--ink); color: var(--ground); border-color: var(--ink); }

main { display: grid; grid-template-columns: minmax(0, 1fr) 390px; gap: 0; min-height: 0; }
.board { position: relative; min-height: 0; border-right: 1px solid var(--rule); overflow: hidden; touch-action: none; }
.board canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
.board canvas.dragging { cursor: grabbing; }
.zoom { position: absolute; right: 10px; top: 10px; display: flex; flex-direction: column; gap: 4px; }
.zoom .btn { width: 32px; height: 32px; padding: 0; font-family: var(--font-data); }
.scale { position: absolute; left: 12px; bottom: 10px; font-family: var(--font-data); font-size: 11px; color: var(--ink-soft); }
.scale em { font-style: normal; color: var(--east); margin-left: 8px; }
.scale i { display: block; height: 4px; border: 1px solid var(--ink-soft); border-top: 0; margin-bottom: 3px; }
.legend { position: absolute; left: 12px; top: 10px; display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--ink-soft); background: color-mix(in srgb, var(--ground) 85%, transparent); padding: 4px 8px; border-radius: 4px; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }

.card { position: absolute; right: 52px; top: 10px; width: 230px; background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; padding: 10px 12px; font-size: 13px; box-shadow: 0 6px 18px rgba(0,0,0,.12); }
.card h2 { font-family: var(--font-display); font-size: 1.15rem; font-weight: 600; margin: 0 0 2px; text-wrap: balance; }
.card dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 8px 0; font-size: 12px; }
.card dt { color: var(--ink-soft); }
.card dd { margin: 0; font-family: var(--font-data); font-variant-numeric: tabular-nums; min-width: 0; overflow-wrap: anywhere; }
.card .row { display: flex; gap: 6px; }

aside { display: grid; grid-template-rows: auto 1fr; min-height: 0; background: var(--panel); }
.tabs { display: flex; border-bottom: 1px solid var(--rule); }
.tabs button { flex: 1; background: none; border: 0; padding: 9px 0 8px; font-family: var(--font-display); font-weight: 600; font-size: 14px; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-soft); border-bottom: 2px solid transparent; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.pane { overflow-y: auto; min-height: 0; }
.filters { display: flex; flex-wrap: wrap; gap: 4px 10px; padding: 8px 12px; border-bottom: 1px solid var(--rule); font-size: 12px; color: var(--ink-soft); position: sticky; top: 0; background: var(--panel); }
.filters label { display: inline-flex; gap: 4px; align-items: center; cursor: pointer; }
.feed { list-style: none; margin: 0; padding: 0; }
.feed li { display: grid; grid-template-columns: 52px 1fr; gap: 8px; padding: 6px 12px; border-bottom: 1px solid var(--rule); cursor: pointer; font-size: 13px; line-height: 1.35; }
.feed li:hover { background: color-mix(in srgb, var(--accent) 8%, transparent); }
.feed time { font-family: var(--font-data); font-size: 12px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.feed .k { font-weight: 600; }
.feed .tag { font-family: var(--font-data); font-size: 11px; color: var(--ink-soft); }
.empty { padding: 16px 12px; color: var(--ink-soft); font-size: 13px; }
.who { font-weight: 500; }
.s-WEST { color: var(--west); } .s-EAST { color: var(--east); } .s-GUER { color: var(--guer); } .s-CIV { color: var(--civ); }

.roster h3 { font-family: var(--font-display); font-size: 13px; letter-spacing: .1em; text-transform: uppercase; margin: 0; padding: 10px 12px 4px; display: flex; justify-content: space-between; }
.roster h3 span { font-family: var(--font-data); font-weight: 400; letter-spacing: 0; color: var(--ink-soft); }
.roster h4 { margin: 0; padding: 6px 12px 2px; font-size: 12px; font-weight: 500; color: var(--ink-soft); }
.roster button { display: grid; grid-template-columns: 14px 1fr auto; gap: 8px; align-items: center; width: 100%; text-align: left; background: none; border: 0; padding: 4px 12px; font-size: 13px; }
.roster button:hover { background: color-mix(in srgb, var(--accent) 8%, transparent); }
.roster button[aria-pressed="true"] { background: color-mix(in srgb, var(--accent) 16%, transparent); }
.roster .dot { width: 9px; height: 9px; border-radius: 50%; justify-self: center; }
.roster .dead { color: var(--dead); text-decoration: line-through; }
.roster small { font-family: var(--font-data); font-size: 11px; color: var(--ink-soft); }

.seg { display: flex; gap: 2px; padding: 8px 12px; border-bottom: 1px solid var(--rule); position: sticky; top: 0; background: var(--panel); z-index: 1; }
.seg button { border: 1px solid var(--rule); background: var(--panel); padding: 3px 9px; font-size: 12px; border-radius: 3px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--ground); border-color: var(--ink); }
.roster h4.node { display: flex; justify-content: space-between; gap: 8px; color: var(--ink); font-weight: 600; }
.roster h4.node small { font-weight: 400; }
.roster .indent { border-left: 1px solid var(--rule); margin-left: 16px; }
.sec { padding: 10px 12px; border-bottom: 1px solid var(--rule); }
.sec h3 { font-family: var(--font-display); font-size: 13px; letter-spacing: .1em; text-transform: uppercase; margin: 0 0 6px; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 3px 12px; margin: 0; font-size: 13px; }
.kv dt { color: var(--ink-soft); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.kv dd.num { font-family: var(--font-data); font-size: 12px; font-variant-numeric: tabular-nums; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chips span { font-family: var(--font-data); font-size: 11px; border: 1px solid var(--rule); border-radius: 3px; padding: 1px 5px; }
.overview { margin: 6px 0 0; font-size: 13px; line-height: 1.45; color: var(--ink-soft); }
.tbl { width: 100%; border-collapse: collapse; font-size: 12px; }
.tbl th { text-align: left; font-weight: 500; color: var(--ink-soft); padding: 3px 4px; border-bottom: 1px solid var(--rule); }
.tbl td { padding: 3px 4px; border-bottom: 1px solid var(--rule); font-variant-numeric: tabular-nums; }
.tbl .n { text-align: right; font-family: var(--font-data); }
.tbl tr[data-type] { cursor: pointer; }
.tbl tr[data-type]:hover, .tbl tr[aria-selected="true"] { background: color-mix(in srgb, var(--accent) 12%, transparent); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stats div { border: 1px solid var(--rule); border-radius: 4px; padding: 6px 8px; }
.stats b { display: block; font-family: var(--font-data); font-size: 16px; font-weight: 500; font-variant-numeric: tabular-nums; }
.stats small { color: var(--ink-soft); font-size: 11px; }
.chart { position: relative; margin-top: 4px; }
.chart canvas { width: 100%; height: 110px; display: block; cursor: crosshair; }
.chart .key { display: flex; gap: 12px; font-size: 11px; color: var(--ink-soft); }
.chart .key i { display: inline-block; width: 14px; height: 0; border-top: 2px solid var(--ink); vertical-align: middle; margin-right: 4px; }
.chart .key i.dash { border-top: 2px dashed var(--ink-soft); }
.tip { position: absolute; pointer-events: none; background: var(--ground); border: 1px solid var(--rule); border-radius: 4px; padding: 4px 7px; font-family: var(--font-data); font-size: 11px; white-space: nowrap; box-shadow: 0 4px 12px rgba(0,0,0,.12); z-index: 2; }
.raw { list-style: none; margin: 0; padding: 0; }
.raw li { display: grid; grid-template-columns: 52px 1fr; gap: 8px; padding: 5px 12px; border-bottom: 1px solid var(--rule); }
.raw time { font-family: var(--font-data); font-size: 12px; color: var(--accent); cursor: pointer; }
.raw code { font-family: var(--font-data); font-size: 11px; overflow-wrap: anywhere; color: var(--ink-soft); }
.search { width: 100%; font: inherit; font-size: 13px; padding: 5px 8px; border: 1px solid var(--rule); border-radius: 4px; background: var(--ground); color: var(--ink); }
.transport { display: grid; grid-template-columns: auto auto 1fr auto; gap: 12px; align-items: center; padding-block: 10px 12px; border-top: 1px solid var(--rule); }
.play { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--ink); color: var(--ground); display: grid; place-items: center; }
.clock { font-family: var(--font-data); font-variant-numeric: tabular-nums; font-size: 15px; }
.clock span { color: var(--ink-soft); font-size: 12px; }
.timeline { position: relative; height: 44px; min-width: 0; }
.timeline canvas { width: 100%; height: 100%; display: block; cursor: pointer; }
.speed { display: flex; gap: 2px; }
.speed button { border: 1px solid var(--rule); background: var(--panel); padding: 4px 7px; font-family: var(--font-data); font-size: 12px; border-radius: 3px; }
.speed button[aria-pressed="true"] { background: var(--ink); color: var(--ground); border-color: var(--ink); }

.drop { position: fixed; inset: 0; display: grid; place-items: center; background: color-mix(in srgb, var(--ground) 88%, transparent); border: 3px dashed var(--accent); font-family: var(--font-display); font-size: 1.6rem; z-index: 10; pointer-events: none; }
.error { color: var(--east); font-size: 12px; }

@media (max-width: 820px) {
  .app { height: auto; min-height: 100%; }
  main { grid-template-columns: 1fr; }
  .board { height: 58svh; border-right: 0; border-bottom: 1px solid var(--rule); }
  aside { height: 50svh; }
  .transport { grid-template-columns: auto 1fr; position: sticky; bottom: 0; background: var(--ground); padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); }
  .timeline { grid-column: 1 / -1; order: 3; }
  .speed { justify-self: end; }
  .card { right: 10px; top: auto; bottom: 34px; width: min(230px, calc(100% - 20px)); }
  .load { margin-left: 0; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app">
  <header>
    <h1>AAR Viewer</h1>
    <div class="meta" id="meta"></div>
    <div class="load">
      <span class="error" id="error" hidden></span>
      <input type="file" id="file" accept=".jsonl,.json,.txt" hidden>
      <button class="btn primary" id="open">Open recording</button>
    </div>
  </header>

  <main>
    <div class="board" id="board">
      <canvas id="map" aria-label="Map of the recorded mission"></canvas>
      <div class="legend" id="legend"></div>
      <div class="zoom">
        <button class="btn" id="zin" aria-label="Zoom in">+</button>
        <button class="btn" id="zout" aria-label="Zoom out">−</button>
        <button class="btn" id="zfit" aria-label="Fit to recording">⤢</button>
      </div>
      <div class="scale" id="scale"><i></i><span></span> <em id="tilenote"></em></div>
      <div class="card" id="card" hidden></div>
    </div>

    <aside>
      <div class="tabs" role="tablist">
        <button role="tab" id="tab-events" aria-selected="true">Events</button>
        <button role="tab" id="tab-units" aria-selected="false">Units</button>
        <button role="tab" id="tab-mission" aria-selected="false">Mission</button>
        <button role="tab" id="tab-server" aria-selected="false">Server</button>
        <button role="tab" id="tab-data" aria-selected="false">Data</button>
      </div>
      <div class="pane" id="pane-events">
        <div class="filters" id="filters"></div>
        <ol class="feed" id="feed"></ol>
      </div>
      <div class="pane" id="pane-units" hidden>
        <div class="seg" id="unitmode" hidden><button data-m="orbat" aria-pressed="true">ORBAT</button><button data-m="groups" aria-pressed="false">Groups</button></div>
        <div class="roster" id="roster"></div>
      </div>
      <div class="pane" id="pane-mission" hidden></div>
      <div class="pane" id="pane-server" hidden></div>
      <div class="pane" id="pane-data" hidden></div>
    </aside>
  </main>

  <div class="transport">
    <button class="play" id="play" aria-label="Play">
      <svg width="16" height="16" viewBox="0 0 16 16" id="playicon"><path fill="currentColor" d="M3 1.5v13l11-6.5z"/></svg>
    </button>
    <div class="clock" id="clock">00:00 <span>/ 00:00</span></div>
    <div class="timeline"><canvas id="tl" aria-label="Timeline"></canvas></div>
    <div class="speed" id="speed"></div>
  </div>
</div>
<div class="drop" id="drop" hidden>Drop the .jsonl recording</div>

<!--SAMPLE-->

<script>
(() => {
  const $ = id => document.getElementById(id);
  const SPEEDS = [1, 2, 4, 8, 16];
  const FILTERS = [
    ["kills", "Kills", true], ["hits", "Hits", true], ["vehicles", "Vehicles", true],
    ["players", "Players", true], ["markers", "Markers", true], ["ai", "AI", true], ["world", "World", true],
    ["shots", "Shots", false],
  ];
  // Record types the parser files somewhere other than the event feed.
  const NOT_EVENTS = new Set(["header", "entity", "snap", "deleted", "submunition", "proj_end", "orbat", "perf"]);

  let rec = null;               // parsed recording
  let t = 0, playing = false, speed = 4;
  let selected = 0, follow = false;
  let view = { cx: 0, cy: 0, scale: 1 };   // world centre and pixels per metre
  const filters = Object.fromEntries(FILTERS.map(f => [f[0], f[2]]));

  const KNOWN = new Set(["end", "group", "player", "shot", "proj_hit", "proj_splash", "killed", "hit", "loadout", "perf_spike", "idle", "building",
    "marker_created", "marker_updated", "marker_deleted", "get_in", "get_out", "seat", "respawn", "connected", "disconnected", "combat_mode", "enemy_detected", "fleeing"]);

  // AI group state from combat_mode / enemy_detected / fleeing, keyed by side and group name.
  const groupKey = (side, name) => side + "|" + name;
  function groupInfo(r, side, name) {
    const k = groupKey(side, name);
    let g = r.groupInfo.get(k);
    if (!g) { g = { modes: [], flee: [], leaders: [] }; r.groupInfo.set(k, g); }
    return g;
  }

  // ---------- parsing ----------
  function parse(text, label) {
    const r = { header: {}, end: null, entities: new Map(), shots: new Map(), hits: [], kills: [], events: [], duration: 0, label,
      counts: new Map(), raw: new Map(), orbat: null, perf: [], spikes: [], idle: [], markers: new Map(), buildings: [], damage: [], groupInfo: new Map(), detections: [] };
    const ent = id => {
      let e = r.entities.get(id);
      if (!e) { e = { id, kind: "unit", name: "#" + id, side: "UNKNOWN", group: "", display: "", cls: "", player: false, states: [], groups: [], players: [], orbats: [], shots: 0, kills: 0, info: {} }; r.entities.set(id, e); }
      return e;
    };
    let bad = 0;
    for (const line of text.split(/\r?\n/)) {
      if (!line.trim()) continue;
      let o; try { o = JSON.parse(line); } catch { bad++; continue; }
      if (!o || typeof o !== "object") { bad++; continue; }
      if (typeof o.t !== "number") o.t = 0;
      r.duration = Math.max(r.duration, o.t);
      const ty = String(o.type ?? "(no type)");
      r.counts.set(ty, (r.counts.get(ty) || 0) + 1);
      if (!r.raw.has(ty)) r.raw.set(ty, []);
      r.raw.get(ty).push(o);
      if (!NOT_EVENTS.has(ty) && !KNOWN.has(ty)) { r.events.push(o); continue; }
      switch (o.type) {
        case "header": r.header = o; break;
        case "end": r.end = o; r.events.push(o); break;
        case "entity": {
          const e = ent(o.id);
          Object.assign(e, { kind: o.kind, cls: o.class, display: o.display || o.class, side: o.side, name: o.name || o.display || o.class, group: o.group || "", player: !!o.player, uid: o.uid || "" });
          e.info = o;
          for (const k of ["role", "role_name", "loadout_faction", "callsign", "orbat_team"]) if (o[k] !== undefined) e[k] = o[k];
          e.groups.push([o.t, o.group || "", o.side]);
          if (o.orbat !== undefined) e.orbats.push([o.t, o.orbat]);
          if (o.player) e.players.push([o.t, o.uid, o.name]);
          break;
        }
        case "snap":
          for (const s of o.e) ent(s[0]).states.push([o.t, s[1], s[2], s[3], s[4], s[5], s[6], s[7]]);
          break;
        case "group": { const e = ent(o.unit); e.groups.push([o.t, o.group, o.side]); if (o.orbat !== undefined) e.orbats.push([o.t, o.orbat]); r.events.push(o); break; }
        case "loadout": { const e = ent(o.unit); for (const k of ["role", "role_name", "loadout_faction"]) if (o[k] !== undefined) e[k] = o[k]; r.events.push(o); break; }
        case "orbat": r.orbat = o; break;
        case "perf": r.perf.push(o); break;
        case "perf_spike": r.spikes.push(o); r.events.push(o); break;
        case "idle": if (o.idle) r.idle.push([o.t, null]); else if (r.idle.length && r.idle.at(-1)[1] === null) r.idle.at(-1)[1] = o.t; r.events.push(o); break;
        case "building": r.buildings.push(o); r.events.push(o); break;
        case "combat_mode": case "enemy_detected": case "fleeing": {
          const g = groupInfo(r, o.side, o.group);
          if (o.leader) g.leaders.push([o.t, o.leader]);
          if (o.type === "combat_mode") g.modes.push([o.t, o.mode]);
          else if (o.type === "fleeing") g.flee.push([o.t, !!o.fleeing]);
          else r.detections.push(o);
          r.events.push(o); break;
        }
        case "marker_created": case "marker_updated": case "marker_deleted": {
          let m = r.markers.get(o.marker);
          if (!m) { m = { states: [], deletedAt: undefined }; r.markers.set(o.marker, m); }
          if (o.type === "marker_deleted") m.deletedAt = o.t;
          else {
            const p = m.states.at(-1) || [0, null, "", "", ""];
            m.states.push([o.t, o.pos || p[1], o.text ?? p[2], o.color ?? p[3], o.markerType ?? p[4]]);
            if (o.type === "marker_created") m.deletedAt = undefined;
          }
          r.events.push(o); break;
        }
        case "player": ent(o.unit).players.push([o.t, o.uid, o.name]); r.events.push(o); break;
        case "deleted": ent(o.id).deletedAt = o.t; break;
        case "shot": r.shots.set(o.id, { id: o.id, t0: o.t, p0: o.pos, v: o.vel, shooter: o.shooter, gunner: o.instigator || 0, ammo: o.ammo, weapon: o.weapon, parent: o.parent }); if (o.shooter) ent(o.shooter).shots++; r.events.push(o); break;
        case "submunition": { const s = r.shots.get(o.id); if (s) { s.parent = o.parent; s.shooter = s.shooter || o.shooter; } break; }
        case "proj_end": { const s = r.shots.get(o.id); if (s) { s.t1 = o.t; s.p1 = o.pos; s.exploded = o.exploded; } break; }
        case "proj_hit": case "proj_splash": r.hits.push(o); r.events.push(o); break;

    // entities: vehicles first, then units on foot

  }

  // ---------- group markers and map events ----------
  const MODE_SHORT = { SAFE: "SAFE", AWARE: "AWARE", COMBAT: "COMBAT", STEALTH: "STEALTH", CARELESS: "CARELESS" };
  function halo(ctx, text, x, y, color) {
    ctx.lineWidth = 3; ctx.strokeStyle = C.ground; ctx.strokeText(text, x, y);
    ctx.fillStyle = color || C.ink; ctx.fillText(text, x, y);
  }
  // One marker per group with living members on the map: a NATO-style frame above the members' centre,
  // with the group's name, its AI behaviour and whether it is fleeing.
  // Group markers merge up the hierarchy as you zoom out: when everything under a TMF ORBAT node fits
  // within MERGE_PX on screen, the node gets one marker instead of one per group. Groups outside the
  // ORBAT merge with nearby groups of the same side instead.
  const MERGE_PX = 90;
  function drawGroups(ctx, states) {
    const groups = new Map();
    for (const [e, s] of states) {
      if (e.kind !== "unit" || !s.alive) continue;
      const name = groupAt(e, t); if (!name) continue;
      const side = sideAt(e, t), k = groupKey(side, name);
      let g = groups.get(k);
      if (!g) { g = { key: k, name, side, x: 0, y: 0, n: 0, player: false, vehicle: 0, x0: Infinity, y0: Infinity, x1: -Infinity, y1: -Infinity, nodes: new Map() }; groups.set(k, g); }
      g.x += s.x; g.y += s.y; g.n++;
      g.x0 = Math.min(g.x0, s.x); g.x1 = Math.max(g.x1, s.x); g.y0 = Math.min(g.y0, s.y); g.y1 = Math.max(g.y1, s.y);
      if (isPlayerAt(e, t)) g.player = true;
      if (s.veh) g.vehicle++;
      const o = orbatAt(e, t);
      if (o !== undefined && rec.nodes.has(o)) g.nodes.set(o, (g.nodes.get(o) || 0) + 1);
    }
    const markers = [];
    const status = keys => {
      let combat = false, flee = false, mode = null;
      for (const k of keys) {
        const info = rec.groupInfo.get(k); if (!info) continue;
        const m = lastOf(info.modes, t), f = lastOf(info.flee, t);
        if (m) { mode = mode && mode !== m[1] ? "mixed" : m[1]; if (m[1] === "COMBAT") combat = true; }
        if (f && f[1]) flee = true;
      }
      return { combat, flee, mode };
    };
    const merge = (list, name, side, echelon) => {
      const m = { name, side, echelon, x: 0, y: 0, n: 0, player: false, vehicle: 0, x0: Infinity, y0: Infinity, x1: -Infinity, y1: -Infinity, keys: [] };
      for (const g of list) {
        m.x += g.x; m.y += g.y; m.n += g.n; m.vehicle += g.vehicle; m.player ||= g.player;
        m.x0 = Math.min(m.x0, g.x0); m.x1 = Math.max(m.x1, g.x1); m.y0 = Math.min(m.y0, g.y0); m.y1 = Math.max(m.y1, g.y1);
        m.keys.push(...(g.keys || [g.key]));
      }
      return m;
    };
    const span = m => Math.max(m.x1 - m.x0, m.y1 - m.y0) * view.scale;

    // ORBAT: groups hang under the node most of their members belong to; groups without one hang
    // under the root of their side's tree, as in TMF's briefing.
    const under = new Map(), loose = [];
    for (const g of groups.values()) {
      let id = null, best = 0;
      for (const [o, c] of g.nodes) if (c > best) { best = c; id = o; }
      let node = id !== null ? rec.nodes.get(id).node : rec.orbat && rec.orbat.teams.find(tm => tm.side === g.side);
      if (!node) { loose.push(g); continue; }
      if (!under.has(node)) under.set(node, []); under.get(node).push(g);
    }
    if (rec.orbat) {
      const all = node => [...(under.get(node) || []), ...(node.children || []).flatMap(all)];
      const place = (node, side, depth) => {
        const list = all(node); if (!list.length) return;
        const m = merge(list, node.name || node.full_name || "ORBAT", side, depth);
        if (list.length > 1 && span(m) < MERGE_PX) { markers.push(m); return; }
        for (const g of under.get(node) || []) markers.push(merge([g], g.name, side, 0));
        for (const c of node.children || []) place(c, side, depth + 1);
      };
      for (const team of rec.orbat.teams) place(team, team.side || "", 0);
    }
    // Groups outside the ORBAT: merge with any marker of the same side within MERGE_PX on screen.
    const clusters = [];
    for (const g of loose.sort((a, b) => b.n - a.n)) {
      const [gx, gy] = toScreen(g.x / g.n, g.y / g.n);
      const c = clusters.find(c => c.side === g.side && Math.hypot(c.sx - gx, c.sy - gy) < MERGE_PX * .6 && span(merge([...c.list, g], "", g.side, 0)) < MERGE_PX);
      if (c) c.list.push(g); else clusters.push({ side: g.side, sx: gx, sy: gy, list: [g] });
    }
    for (const c of clusters) markers.push(merge(c.list, c.list[0].name + (c.list.length > 1 ? " +" + (c.list.length - 1) : ""), c.side, c.list.length > 1 ? 1 : 0));

    const font = getComputedStyle(document.body);
    const placed = [];
    for (const m of markers.sort((a, b) => b.y / b.n - a.y / a.n)) {
      const [cx, cy] = toScreen(m.x / m.n, m.y / m.n);
      // Stack markers upwards when another marker already sits there, at most three deep;
      // past that the marker is drawn without its labels so a crowded area stays readable.
      let my = cy - 30, depth = 0;
      while (depth < 3 && placed.some(([px, py]) => Math.abs(px - cx) < 110 && Math.abs(py - my) < 26)) { my -= 26; depth++; }
      const crowded = placed.some(([px, py]) => Math.abs(px - cx) < 110 && Math.abs(py - my) < 26);
      if (crowded) my = cy - 30;
      placed.push([cx, my]);
      const st = status(m.keys);
      const col = sideColor(m.side);
      const big = m.keys.length > 1, W2 = big ? 16 : 13, H2 = big ? 11 : 9, x = cx, y = my;
      ctx.strokeStyle = C["ink-soft"]; ctx.lineWidth = 1; ctx.setLineDash([2, 2]);
      ctx.beginPath(); ctx.moveTo(cx, cy - 8); ctx.lineTo(x, y + H2); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = C.panel; ctx.strokeStyle = col; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.rect(x - W2, y - H2, W2 * 2, H2 * 2); ctx.fill(); ctx.stroke();
      // Infantry cross, plus an oval when most of the unit rides in vehicles.
      ctx.lineWidth = 1.5; ctx.beginPath();

      if (m.vehicle * 2 > m.n) { ctx.beginPath(); ctx.ellipse(x, y, W2 - 4, H2 - 3, 0, 0, Math.PI * 2); ctx.stroke(); }

      }
      if (m.player) { ctx.strokeStyle = C.ink; ctx.lineWidth = 1; ctx.strokeRect(x - W2 - 3, y - H2 - 3, W2 * 2 + 6, H2 * 2 + 6); }
      if (crowded) continue;
      ctx.textAlign = "left"; ctx.textBaseline = "middle";
      ctx.font = "600 12px " + font.getPropertyValue("--font-ui");
      halo(ctx, m.name + " (" + m.n + ")", x + W2 + 6, y - 4, C.ink);
      const tags = [];
      if (big && m.keys.length > 1) tags.push(m.keys.length + " groups");
      if (st.mode && st.mode !== "AWARE" && st.mode !== "mixed") tags.push(MODE_SHORT[st.mode] || st.mode);   // AWARE is the AI default
      else if (st.combat) tags.push("IN COMBAT");
      if (st.flee) tags.push("FLEEING");
      if (tags.length) {

        halo(ctx, tags.join(" · "), x + W2 + 6, y + 9, st.flee || st.combat ? C.east : C["ink-soft"]);
      }

  }
  // Recent events float as short labels at the unit or group they concern, fading out over a few seconds.
  const EVENT_SECONDS = 4;
  const GROUP_EVENTS = new Set(["combat_mode", "enemy_detected", "fleeing", "killed"]);
  function eventLabel(o) {
    switch (o.type) {
      case "combat_mode": return [o.leader, MODE_SHORT[o.mode] || o.mode, o.mode === "COMBAT"];
      case "enemy_detected": return [o.leader, "enemy spotted", true];
      case "fleeing": return [o.leader, o.fleeing ? "fleeing" : "rallied", !!o.fleeing];
      case "get_in": return [o.unit, "in " + (o.role || "vehicle")];
      case "get_out": return [o.unit, o.eject ? "ejected" : "got out"];
      case "seat": return [o.unit, "to " + (o.role || "seat")];
      case "loadout": return [o.unit, o.role_name || o.role || "loadout"];
      case "respawn": return [o.new, "respawned"];
      case "player": return [o.unit, o.uid ? "player: " + o.name : "now AI"];
      case "group": return [o.unit, "joined " + o.group];

  }
  function drawEvents(ctx) {
    const font = getComputedStyle(document.body).getPropertyValue("--font-data");
    // Detection lines from the spotting group's leader to the enemy.
    for (const o of rec.detections) {
      if (o.t > t || t - o.t > EVENT_SECONDS) continue;
      const a = rec.entities.get(o.leader), b = rec.entities.get(o.target);
      const sa = a && stateAt(a, t), sb = b && stateAt(b, t); if (!sa || !sb) continue;
      const [ax, ay] = toScreen(sa.x, sa.y), [bx, by] = toScreen(sb.x, sb.y);

      ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke(); ctx.setLineDash([]);

    ctx.textAlign = "center"; ctx.textBaseline = "bottom"; ctx.font = "600 11px " + font;
    for (let i = i1; i >= 0 && t - rec.events[i].t <= EVENT_SECONDS; i--) {

      // Per-unit labels only once zoomed in far enough to tell units apart (about 40 px per 100 m).
      if (view.scale < 0.4 && (!GROUP_EVENTS.has(o.type) || o.mode === "AWARE")) continue;
      const e = rec.entities.get(l[0]), st = e && stateAt(e, t); if (!st) continue;

  }

  // ---------- timeline ----------
  const tl = $("tl"), tctx = tl.getContext("2d");
  let tlDirty = true, tlBase = null;
  function drawTimeline() {
    const w = tl.width / DPR, h = tl.height / DPR;
    tctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    if (tlDirty || !tlBase) {
      tctx.clearRect(0, 0, w, h);
      tctx.fillStyle = C.panel; tctx.fillRect(0, 8, w, h - 16);
      if (rec && rec.duration > 0) {
        tctx.fillStyle = C["grid-major"];
        for (const [a, b] of rec.idle) tctx.fillRect(a / rec.duration * w, 8, Math.max(1, (b - a) / rec.duration * w), h - 16);
        const D = rec.duration, bins = Math.max(10, Math.floor(w / 3)), counts = new Array(bins).fill(0);
        for (const s of rec.shotList) counts[Math.min(bins - 1, Math.floor(s.t0 / D * bins))]++;

        tctx.globalAlpha = 1;
        tctx.fillStyle = C.east;

        tctx.fillStyle = C.ink; tctx.globalAlpha = .55;

        tctx.globalAlpha = 1;
        tctx.fillStyle = C.accent;
        for (const k of rec.spikes) { const x = k.t / D * w; tctx.fillRect(x - 1, h - 20, 2, 12); }
        tctx.fillStyle = C["ink-soft"]; tctx.font = "10px " + getComputedStyle(document.body).getPropertyValue("--font-data"); tctx.textBaseline = "bottom";

      const x = t / rec.duration * w;
      tctx.fillStyle = C.accent; tctx.fillRect(x - 1, 0, 2, h);
      tctx.beginPath(); tctx.moveTo(x - 5, 0); tctx.lineTo(x + 5, 0); tctx.lineTo(x, 6); tctx.fill();
    }
  }

  // ---------- feed ----------
  function describe(o) {
    switch (o.type) {
      case "killed": return ["kills", '<span class="k s-EAST">Killed</span> ' + who(o.victim, o.t) + (o.instigator || o.killer ? " by " + who(o.instigator || o.killer, o.t) : "") + (o.pos ? ' <span class="tag">' + grid(o.pos[0], o.pos[1]) + "</span>" : "")];
      case "proj_hit": { const s = rec.shots.get(o.id); return ["hits", who(o.target, o.t) + " hit" + (o.part ? ' in <span class="tag">' + esc(o.part) + "</span>" : "") + (s && s.shooter ? " by " + who(s.gunner || s.shooter, o.t) : "")]; }
      case "proj_splash": { const s = rec.shots.get(o.id); return ["hits", who(o.target, o.t) + " caught in blast" + (s && s.ammo ? ' <span class="tag">' + esc(s.ammo) + "</span>" : "")]; }
      case "hit": return ["hits", who(o.unit, o.t) + ' took <span class="tag">' + Math.round(o.damage * 100) + "%</span> damage" + (o.instigator || o.source ? " from " + who(o.instigator || o.source, o.t) : "")];
      case "shot": return ["shots", who(o.instigator || o.shooter, o.t) + ' fired <span class="tag">' + esc(o.weapon || o.ammo) + "</span>"];
      case "get_in": return ["vehicles", who(o.unit, o.t) + " got in " + who(o.vehicle, o.t) + ' <span class="tag">' + esc(o.role) + "</span>"];
      case "get_out": return ["vehicles", who(o.unit, o.t) + (o.eject ? " ejected from " : " got out of ") + who(o.vehicle, o.t)];
      case "seat": return ["vehicles", who(o.unit, o.t) + " moved to " + esc(o.role) + " in " + who(o.vehicle, o.t)];
      case "loadout": return ["players", who(o.unit, o.t) + " got the " + esc(o.role_name || o.role) + ' loadout <span class="tag">' + esc(o.loadout_faction) + "</span>"];
      case "combat_mode": return ["ai", '<span class="who s-' + esc(o.side) + '">' + esc(o.group) + '</span> is now <span class="tag">' + esc(o.mode) + "</span>"];
      case "enemy_detected": return ["ai", '<span class="who s-' + esc(o.side) + '">' + esc(o.group) + "</span> spotted " + who(o.target, o.t)];
      case "fleeing": return ["ai", '<span class="who s-' + esc(o.side) + '">' + esc(o.group) + "</span> " + (o.fleeing ? "started fleeing" : "stopped fleeing")];
      case "building": return ["world", (o.ruin ? "Building destroyed" : "Building changed") + ' <span class="tag">' + esc(o.from) + "</span>" + (o.pos ? ' <span class="tag">' + grid(o.pos[0], o.pos[1]) + "</span>" : "")];
      case "idle": return ["world", o.idle ? "Server empty, recording paused" : "Players back, recording resumed"];
      case "perf_spike": return ["world", 'Server frame took <span class="tag">' + Math.round(o.frame_ms) + " ms</span>" + (o.recorder_ms !== undefined ? ' <span class="tag">recorder ' + (+o.recorder_ms).toFixed(1) + " ms</span>" : "")];
      case "connected": return ["players", '<span class="who">' + esc(o.name) + "</span> connected" + (o.jip ? ' <span class="tag">JIP</span>' : "")];
      case "disconnected": return ["players", '<span class="who">' + esc(o.name) + "</span> disconnected"];
      case "player": return ["players", o.uid ? '<span class="who">' + esc(o.name) + "</span> took control of " + who(o.unit, o.t - 0.001) : who(o.unit, o.t) + " is now AI"];
      case "group": return ["players", who(o.unit, o.t) + " joined " + esc(o.group) + ' <span class="tag">' + esc(sideName(o.side)) + "</span>"];
      case "respawn": return ["players", who(o.new, o.t) + " respawned"];
      case "marker_created": return ["markers", "Marker placed" + (o.text ? ": " + esc(o.text) : "") + (o.pos ? ' <span class="tag">' + grid(o.pos[0], o.pos[1]) + "</span>" : "")];
      case "marker_updated": return ["markers", "Marker moved" + (o.text ? ": " + esc(o.text) : "")];
      case "marker_deleted": { const m = rec.markers.get(o.marker), st = m && lastOf(m.states, o.t); return ["markers", "Marker removed" + (st && st[2] ? ": " + esc(st[2]) : "") + (o.by ? " by " + who(o.by, o.t) : "")]; }
      case "end": return [null, '<span class="k">Mission ended</span> <span class="tag">' + esc(o.reason) + "</span>"];
    }
    // A record type this page does not know: show its fields as they are.
    const f = Object.entries(o).filter(([k]) => k !== "type" && k !== "t").map(([k, v]) => esc(k) + "=" + esc(typeof v === "object" ? JSON.stringify(v) : v)).join(" ");

  }
  let feedKey = "";
  function renderFeed(force) {
    if (!rec) return;

    if (!force && key === feedKey) return;
    feedKey = key;
    const out = [];
    for (let i = n - 1; i >= 0 && out.length < 250; i--) {
      const o = rec.events[i], d = describe(o); if (!d) continue;
      if (d[0] && !filters[d[0]]) continue;
      out.push('<li data-t="' + o.t + '"><time>' + fmt(o.t) + "</time><div>" + d[1] + "</div></li>");
    }
    $("feed").innerHTML = out.length ? out.join("") : '<li class="empty" style="display:block">Nothing yet at ' + fmt(t) + ". Press play or drag the timeline.</li>";
  }

  // ---------- roster ----------
  let rosterKey = "", unitMode = "orbat";
  const SIDE_VAR = { WEST: "west", EAST: "east", GUER: "guer", CIV: "civ" };
  function unitButton(e, sd) {

      out.push('<li><time data-t="' + o.t + '">' + fmt(o.t) + "</time><code>" + esc(j.length > 600 ? j.slice(0, 600) + "… (" + j.length + " characters)" : j) + "</code></li>");
    }
    if (matched > shown) out.push('<li style="display:block"><button class="btn" id="more">Show more (' + (matched - shown) + " left)</button></li>");
    if (!matched) out.push('<li class="empty" style="display:block">No records match.</li>');
    $("rawlist").innerHTML = out.join("");
  }

  // ---------- header ----------
  function renderMeta() {
    const h = rec.header;
    const players = new Set(); for (const e of rec.entities.values()) for (const p of e.players) if (p[1]) players.add(p[1]);
    const started = h.started_utc ? new Date(h.started_utc) : null;
    $("meta").innerHTML =
      (rec.label ? '<span class="sample">' + esc(rec.label) + "</span>" : "") +
      "<span><b>" + esc(h.mission || "Unknown mission") + "</b> on " + esc(h.world || "?") + "</span>" +
      (started && !isNaN(started) ? "<span>" + started.toISOString().slice(0, 16).replace("T", " ") + " UTC</span>" : "") +
      "<span>" + fmt(rec.duration) + "</span>" +
      "<span>" + rec.entities.size + " entities" + (players.size ? ", " + players.size + (players.size > 1 ? " players" : " player") : "") + "</span>" +
      "<span>" + rec.shots.size + " shots</span><span>" + rec.kills.length + " kills</span>";
    const sides = new Set([...rec.entities.values()].map(e => e.side));
    $("legend").innerHTML = [...sides].filter(s => ["WEST", "EAST", "GUER", "CIV"].includes(s)).sort().map(s =>
      '<span><i style="background:var(--' + ({ WEST: "west", EAST: "east", GUER: "guer", CIV: "civ" })[s] + ')"></i>' + sideName(s) + "</span>").join("") +
      '<span><i style="background:var(--accent);border-radius:0;height:2px"></i>Tracer</span>';
  }

  function load(text, label) {
    try {
      const r = parse(text, label);
      r.eventTimes = r.events.map(e => [e.t]);
      r.perfTimes = r.perf.map(p => [p.t]);
      const world = String(r.header.world || "").toLowerCase();
      loadTerrain(world, +r.header.world_size || WORLD_SIZES[world] || 0);
      rec = r; t = 0; selected = 0; follow = false; playing = false; setPlayIcon();
      $("error").hidden = true;
      unitMode = r.orbat ? "orbat" : "groups"; $("unitmode").hidden = !r.orbat; setUnitMode(unitMode);
      dataType = null; dataLimit = 100; dataQuery = "";
      renderMeta(); resize(); readColors(); fit(); feedKey = ""; renderFeed(true); renderRoster(true); renderCard(true);
      renderMission(); renderServer(); renderData(); drawCharts();
      tlDirty = true;
    } catch (err) {
      $("error").textContent = err.message; $("error").hidden = false;
    }
  }

  // ---------- controls ----------
  function setPlayIcon() {
    $("playicon").innerHTML = playing ? '<path fill="currentColor" d="M3 2h3.5v12H3zM9.5 2H13v12H9.5z"/>' : '<path fill="currentColor" d="M3 1.5v13l11-6.5z"/>';
    $("play").setAttribute("aria-label", playing ? "Pause" : "Play");
  }
  $("play").onclick = () => { if (!rec) return; if (t >= rec.duration) t = 0; playing = !playing; setPlayIcon(); };
  $("speed").innerHTML = SPEEDS.map(s => '<button data-s="' + s + '" aria-pressed="' + (s === speed) + '">' + s + "×</button>").join("");
  $("speed").onclick = e => { const b = e.target.closest("button"); if (!b) return; speed = +b.dataset.s; for (const x of $("speed").children) x.setAttribute("aria-pressed", +x.dataset.s === speed); };
  $("filters").innerHTML = FILTERS.map(f => '<label><input type="checkbox" id="f-' + f[0] + '"' + (f[2] ? " checked" : "") + ">" + f[1] + "</label>").join("");
  $("filters").onchange = e => { filters[e.target.id.slice(2)] = e.target.checked; renderFeed(true); };
  $("feed").onclick = e => { const li = e.target.closest("li[data-t]"); if (li) { t = +li.dataset.t; } };
  $("pane-units").onclick = e => { const b = e.target.closest("button[data-id]"); if (!b) return; const id = +b.dataset.id; select(id === selected ? 0 : id); const en = rec.entities.get(id), s = en && stateAt(en, t); if (s && id) { view.cx = s.x; view.cy = s.y; } };
  const TABS = ["events", "units", "mission", "server", "data"];
  for (const name of TABS) {
    $("tab-" + name).onclick = () => {
      for (const x of TABS) { $("tab-" + x).setAttribute("aria-selected", x === name); $("pane-" + x).hidden = x !== name; }
      renderRoster(true); drawCharts();
    };
  }
  function setUnitMode(m) { unitMode = m; for (const b of $("unitmode").children) b.setAttribute("aria-pressed", b.dataset.m === m); renderRoster(true); }
  $("unitmode").onclick = e => { const b = e.target.closest("button[data-m]"); if (b) setUnitMode(b.dataset.m); };
  // Anything with a time in the Mission, Server and Data tabs seeks there when clicked.
  for (const name of ["mission", "server", "data"]) $("pane-" + name).addEventListener("click", e => { const x = e.target.closest("[data-t]"); if (x && rec) t = Math.min(rec.duration, +x.dataset.t); });
  $("pane-data").addEventListener("click", e => {
    const tr = e.target.closest("tr[data-type]");
    if (tr) { dataType = tr.dataset.type; dataLimit = 100; for (const r of $("types").querySelectorAll("tr[data-type]")) r.setAttribute("aria-selected", r === tr); renderDataList(); $("dq").scrollIntoView({ block: "start" }); }
    if (e.target.id === "more") { dataLimit += 200; renderDataList(); }
  });
  $("pane-data").addEventListener("input", e => { if (e.target.id === "dq") { dataQuery = e.target.value; dataLimit = 100; renderDataList(); } });
  $("pane-server").addEventListener("pointermove", e => { const cv = e.target.closest("canvas[data-i]"); chartHover = cv ? { i: +cv.dataset.i, x: e.offsetX } : null; });
  $("pane-server").addEventListener("pointerleave", () => chartHover = null);
  $("pane-server").addEventListener("click", e => {
    const cv = e.target.closest("canvas[data-i]"); if (!cv || !rec) return;
    const w = cv.getBoundingClientRect().width; t = Math.min(rec.duration, Math.max(0, (e.offsetX - 34) / (w - 40) * rec.duration));
  });
  $("zin").onclick = () => zoomAt(1.5); $("zout").onclick = () => zoomAt(1 / 1.5); $("zfit").onclick = () => rec && fit();
  $("open").onclick = () => $("file").click();
  $("file").onchange = e => { const f = e.target.files[0]; if (f) f.text().then(x => load(x, "")); e.target.value = ""; };

  // drag and drop
  let dragDepth = 0;
  addEventListener("dragenter", e => { if ([...e.dataTransfer.types].includes("Files")) { dragDepth++; $("drop").hidden = false; e.preventDefault(); } });
  addEventListener("dragover", e => e.preventDefault());
  addEventListener("dragleave", () => { if (--dragDepth <= 0) { dragDepth = 0; $("drop").hidden = true; } });
  addEventListener("drop", e => { e.preventDefault(); dragDepth = 0; $("drop").hidden = true; const f = e.dataTransfer.files[0]; if (f) f.text().then(x => load(x, "")); });

  // map pan / zoom / pick
  const pointers = new Map(); let moved = 0, pinch = 0;
  map.addEventListener("pointerdown", e => { map.setPointerCapture(e.pointerId); pointers.set(e.pointerId, [e.offsetX, e.offsetY]); moved = 0; map.classList.add("dragging"); });
  map.addEventListener("pointermove", e => {
    if (!pointers.has(e.pointerId)) return;
    const [px, py] = pointers.get(e.pointerId);
    if (pointers.size === 1) {
      const dx = e.offsetX - px, dy = e.offsetY - py; moved += Math.abs(dx) + Math.abs(dy);
      if (moved > 3) { view.cx -= dx / view.scale; view.cy += dy / view.scale; follow = false; }
    }
    pointers.set(e.pointerId, [e.offsetX, e.offsetY]);
    if (pointers.size === 2) {
      const [a, b] = [...pointers.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]);
      if (pinch) zoomAt(d / pinch, (a[0] + b[0]) / 2, (a[1] + b[1]) / 2);
      pinch = d; moved = 99;
    }
  });
  const up = e => {
    pointers.delete(e.pointerId); if (pointers.size < 2) pinch = 0; map.classList.remove("dragging");
    if (moved <= 3 && rec && e.type === "pointerup") {
      let best = 0, bd = 14;
      for (const [id, sx, sy] of drawn) { const d = Math.hypot(sx - e.offsetX, sy - e.offsetY); if (d < bd) { bd = d; best = id; } }
      select(best);
    }
  };
  map.addEventListener("pointerup", up); map.addEventListener("pointercancel", up);
  map.addEventListener("wheel", e => { e.preventDefault(); zoomAt(Math.exp(-e.deltaY * 0.0015), e.offsetX, e.offsetY); }, { passive: false });

  // timeline scrub
  let scrubbing = false;
  const scrub = e => { if (!rec) return; const r = tl.getBoundingClientRect(); t = Math.min(rec.duration, Math.max(0, (e.clientX - r.left) / r.width * rec.duration)); };
  tl.addEventListener("pointerdown", e => { scrubbing = true; tl.setPointerCapture(e.pointerId); scrub(e); });
  tl.addEventListener("pointermove", e => scrubbing && scrub(e));
  tl.addEventListener("pointerup", () => scrubbing = false);

  addEventListener("keydown", e => {
    if (!rec || e.target.closest("input, select")) return;
    if (e.code === "Space") { e.preventDefault(); $("play").click(); }
    else if (e.key === "ArrowRight") t = Math.min(rec.duration, t + (e.shiftKey ? 30 : 5));
    else if (e.key === "ArrowLeft") t = Math.max(0, t - (e.shiftKey ? 30 : 5));
    else if (e.key === "]") { const i = SPEEDS.indexOf(speed); if (i < SPEEDS.length - 1) $("speed").children[i + 1].click(); }
    else if (e.key === "[") { const i = SPEEDS.indexOf(speed); if (i > 0) $("speed").children[i - 1].click(); }
    else if (e.key === "Escape") select(0);
  });

  // theme changes
  const themeChanged = () => { readColors(); tlDirty = true; for (const c of charts) c.base = null; };
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", themeChanged);
  new MutationObserver(themeChanged).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  new ResizeObserver(() => resize()).observe($("board"));
  new ResizeObserver(() => resize()).observe(tl);
  new ResizeObserver(() => { for (const c of charts) c.base = null; }).observe($("pane-server"));

  // main loop
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000); last = now;
    if (rec && playing) { t += dt * speed; if (t >= rec.duration) { t = rec.duration; playing = false; setPlayIcon(); } }
    drawMap(); drawTimeline(); drawCharts();
    if (rec) {
      $("clock").innerHTML = fmt(t) + " <span>/ " + fmt(rec.duration) + "</span>";
      renderFeed(); renderRoster(); renderCard();
    }
    requestAnimationFrame(frame);
  }

  readColors(); resize();
  const sample = document.getElementById("sample");
  // ?src=<url> opens a recording from a web address (the server must allow cross-origin requests).
  const src = new URLSearchParams(location.search).get("src");
  if (src) {
    $("meta").innerHTML = "<span>Loading " + esc(src) + "…</span>";
    fetch(src).then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
      .then(x => load(x, ""), err => { $("meta").innerHTML = ""; $("error").textContent = "Could not load " + src + ": " + err.message; $("error").hidden = false; });
  } else if (sample) load(sample.textContent, sample.dataset.label || "Example recording");
  else $("meta").innerHTML = "<span>Open a <b>.jsonl</b> recording from the <b>aar</b> folder, or drop it on the page.</span>";
  requestAnimationFrame(frame);
})();
</script>
